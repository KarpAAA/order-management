# Local environment. Infra (postgres, postgres-replica, pgbouncer, postgres-payments,
# postgres-inventory, postgres-notifications, redis, rabbitmq, mailpit, lgtm, fake-psp) starts
# by default; `docker compose --profile app up --build` adds the services: api + worker from ONE
# image, payments, inventory and notifications each from its own, and `alloy`, the agent that
# takes their log lines to Loki.
name: oms

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: oms
    ports:
      - '5432:5432'
    volumes:
      # postgres:18 keeps PGDATA in a versioned subfolder; mount the parent
      - postgres-data:/var/lib/postgresql
      # the application role's login, on an empty volume only
      - ./devtools/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms -d oms']
      interval: 5s
      timeout: 3s
      retries: 10

  # Hot standby of postgres: streams its WAL and serves reads only (ADR 0009). GET requests
  # read it unless the caller wrote a moment ago and the replica has not replayed that yet.
  postgres-replica:
    image: postgres:18
    entrypoint: ['bash', '/usr/local/bin/replica-entrypoint.sh']
    command: ['-c', 'hot_standby_feedback=on']
    environment:
      PRIMARY_HOST: postgres
      REPLICATION_PASSWORD: replicator
    ports:
      - '5433:5432'
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./devtools/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms -d oms']
      interval: 5s
      timeout: 3s
      retries: 10
      # the first start copies the whole primary before it answers
      start_period: 300s

  # The database of payments-service: its own server, nothing shared with the api's (ADR 0012).
  postgres-payments:
    image: postgres:18
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - '5434:5432'
    volumes:
      - postgres-payments-data:/var/lib/postgresql
      # the application role's login, on an empty volume only
      - ./devtools/postgres-payments/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 5s
      timeout: 3s
      retries: 10

  # The database of inventory-service: its own server as well (ADR 0016).
  postgres-inventory:
    image: postgres:18
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - '5435:5432'
    volumes:
      - postgres-inventory-data:/var/lib/postgresql
      # the application role's login, on an empty volume only
      - ./devtools/postgres-inventory/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory -d inventory']
      interval: 5s
      timeout: 3s
      retries: 10

  # The database of notifications-service: its own server as well (ADR 0019).
  postgres-notifications:
    image: postgres:18
    environment:
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
      POSTGRES_DB: notifications
    ports:
      - '5436:5432'
    volumes:
      - postgres-notifications-data:/var/lib/postgresql
      # the application role's login, on an empty volume only
      - ./devtools/postgres-notifications/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notifications -d notifications']
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction-mode pooler in front of postgres, for the application role only (ADR 0008).
  # api and worker go through it, in the `app` profile and under `pnpm dev` on the host alike;
  # the owner (migrations, seed, datagen) connects to postgres directly.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    volumes:
      - ./devtools/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./devtools/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # The broker between the services: commands and events (@oms/contracts, docs/adr/0011).
  # Management UI: http://localhost:15672 (guest / guest).
  # The shovel plugins add "Move messages" to a queue page: how a message parked in a
  # dead-letter queue (<queue>.dlq, docs/adr/0013) is put back once its cause is fixed.
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./devtools/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # The mail server of the dev stack: takes every mail notifications-service sends over SMTP
  # and delivers none. What it took: http://localhost:8025. Nothing is kept across restarts.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # The observability stack of the dev environment: Grafana, Loki (logs), Tempo (traces),
  # Prometheus (metrics), Pyroscope and an OpenTelemetry Collector in one container
  # (docs/adr/0024-observability-stack.md). Grafana: http://localhost:3001 (admin / admin).
  # The Collector takes OTLP on 4317 (gRPC) and 4318 (HTTP) and hands each signal to its store.
  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - '3001:3000' # Grafana; 3000 on the host is the api
      - '4317:4317'
      - '4318:4318'
    volumes:
      # everything the five keep: logs, traces, metrics, and the dashboards of Grafana
      - lgtm-data:/data
    healthcheck:
      # the check of the image (every component answers), asked more often than its 30 s
      test: ['CMD', '/otel-lgtm/docker/healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 30

  # The agent of the logs (docs/adr/0026): reads the stdout of the containers of the services
  # through the Docker socket and pushes the lines to Loki inside `lgtm`, again and again
  # until it answers. Nobody depends on it: a service writes to stdout and runs the same
  # without it.
  alloy:
    profiles: [app]
    image: grafana/alloy:v1.20.1
    volumes:
      - ./devtools/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # how far each container was read: a restart of the agent sends no line twice
      - alloy-data:/var/lib/alloy/data

  fake-psp:
    build:
      context: .
      dockerfile: devtools/fake-psp/Dockerfile
    environment:
      PORT: 4010
      FAKE_PSP_LATENCY_MS: 200
      FAKE_PSP_FAILURE_RATE: 0
      FAKE_PSP_THROTTLE_RATE: 0
      FAKE_PSP_DECLINE_RATE: 0
    ports:
      - '4010:4010'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4010/charges').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── profile: app ─────────────────────────────────────────────────────────────
  # One-shot migration step, never part of the api/worker CMD (data/migrations.md §2).
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: build
    image: oms-api-build:local
    working_dir: /repo/services/api
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_ADMIN_URL: postgresql://oms:oms@postgres:5432/oms?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: oms-api:local
    command: ['node', '--require', './dist/instrumentation.js', 'dist/entrypoints/main.api.js']
    env_file: services/api/.env.example
    environment:
      &app-env # through the pooler; the migrate step above goes to postgres directly, as the owner
      DATABASE_URL: postgresql://oms_app:oms_app@pgbouncer:6432/oms?schema=public
      DATABASE_REPLICA_URL: postgresql://oms_app:oms_app@pgbouncer:6432/oms_replica?schema=public
      # env_file is the dev environment; the processes themselves get no owner URL
      DATABASE_ADMIN_URL: ''
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # JSON lines: the image carries no pino-pretty, and a container's log is read by a collector
      LOG_PRETTY: 'false'
      # the Collector of the `lgtm` container; not a dependency: a service runs without it
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # traces only: the log lines are read from stdout by `alloy`, and both would store each twice
      OTEL_LOGS_EXPORTER: none
    ports:
      - '3000:3000'
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    profiles: [app]
    image: oms-api:local
    command: ['node', '--require', './dist/instrumentation.js', 'dist/entrypoints/main.worker.js']
    env_file: services/api/.env.example
    environment: *app-env
    depends_on:
      <<: *app-deps
      api:
        condition: service_started

  # ── payments-service: its own image, database and migration step ───────────────
  migrate-payments:
    profiles: [app]
    build:
      context: .
      dockerfile: services/payments/Dockerfile
      target: build
    image: oms-payments-build:local
    working_dir: /repo/services/payments
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_ADMIN_URL: postgresql://payments:payments@postgres-payments:5432/payments?schema=public
    depends_on:
      postgres-payments:
        condition: service_healthy

  payments:
    profiles: [app]
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    image: oms-payments:local
    env_file: services/payments/.env.example
    environment:
      DATABASE_URL: postgresql://payments_app:payments_app@postgres-payments:5432/payments?schema=public
      # env_file is the dev environment; the process itself gets no owner URL
      DATABASE_ADMIN_URL: ''
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PSP_BASE_URL: http://fake-psp:4010
      # JSON lines: the image carries no pino-pretty, and a container's log is read by a collector
      LOG_PRETTY: 'false'
      # the Collector of the `lgtm` container; not a dependency: a service runs without it
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # traces only: the log lines are read from stdout by `alloy`, and both would store each twice
      OTEL_LOGS_EXPORTER: none
    depends_on:
      migrate-payments:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      fake-psp:
        condition: service_healthy

  # ── inventory-service: its own image, database and migration step ──────────────
  migrate-inventory:
    profiles: [app]
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
      target: build
    image: oms-inventory-build:local
    working_dir: /repo/services/inventory
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_ADMIN_URL: postgresql://inventory:inventory@postgres-inventory:5432/inventory?schema=public
    depends_on:
      postgres-inventory:
        condition: service_healthy

  inventory:
    profiles: [app]
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    image: oms-inventory:local
    env_file: services/inventory/.env.example
    environment:
      DATABASE_URL: postgresql://inventory_app:inventory_app@postgres-inventory:5432/inventory?schema=public
      # env_file is the dev environment; the process itself gets no owner URL
      DATABASE_ADMIN_URL: ''
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # JSON lines: the image carries no pino-pretty, and a container's log is read by a collector
      LOG_PRETTY: 'false'
      # the Collector of the `lgtm` container; not a dependency: a service runs without it
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # traces only: the log lines are read from stdout by `alloy`, and both would store each twice
      OTEL_LOGS_EXPORTER: none
    depends_on:
      migrate-inventory:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # ── notifications-service: its own image, database and migration step ──────────
  migrate-notifications:
    profiles: [app]
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
      target: build
    image: oms-notifications-build:local
    working_dir: /repo/services/notifications
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_ADMIN_URL: postgresql://notifications:notifications@postgres-notifications:5432/notifications?schema=public
    depends_on:
      postgres-notifications:
        condition: service_healthy

  notifications:
    profiles: [app]
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    image: oms-notifications:local
    env_file: services/notifications/.env.example
    environment:
      DATABASE_URL: postgresql://notifications_app:notifications_app@postgres-notifications:5432/notifications?schema=public
      # env_file is the dev environment; the process itself gets no owner URL
      DATABASE_ADMIN_URL: ''
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailpit
      # JSON lines: the image carries no pino-pretty, and a container's log is read by a collector
      LOG_PRETTY: 'false'
      # the Collector of the `lgtm` container; not a dependency: a service runs without it
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # traces only: the log lines are read from stdout by `alloy`, and both would store each twice
      OTEL_LOGS_EXPORTER: none
    depends_on:
      migrate-notifications:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  postgres-notifications-data:
  postgres-inventory-data:
  postgres-payments-data:
  postgres-data:
  postgres-replica-data:
  redis-data:
  rabbitmq-data:
  lgtm-data:
  alloy-data:
