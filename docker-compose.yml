# Local environment. Infra (postgres, postgres-replica, pgbouncer, postgres-payments, redis, rabbitmq,
# fake-psp) starts by default; `docker compose --profile app up --build` adds the services:
# api + worker from ONE image, payments from its own.
name: oms

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: oms
    ports:
      - '5432:5432'
    volumes:
      # postgres:18 keeps PGDATA in a versioned subfolder; mount the parent
      - postgres-data:/var/lib/postgresql
      # the application role's login, on an empty volume only
      - ./devtools/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms -d oms']
      interval: 5s
      timeout: 3s
      retries: 10

  # Hot standby of postgres: streams its WAL and serves reads only (ADR 0009). GET requests
  # read it unless the caller wrote a moment ago and the replica has not replayed that yet.
  postgres-replica:
    image: postgres:18
    entrypoint: ['bash', '/usr/local/bin/replica-entrypoint.sh']
    command: ['-c', 'hot_standby_feedback=on']
    environment:
      PRIMARY_HOST: postgres
      REPLICATION_PASSWORD: replicator
    ports:
      - '5433:5432'
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./devtools/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms -d oms']
      interval: 5s
      timeout: 3s
      retries: 10
      # the first start copies the whole primary before it answers
      start_period: 300s

  # The database of payments-service: its own server, nothing shared with the api's (ADR 0012).
  postgres-payments:
    image: postgres:18
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - '5434:5432'
    volumes:
      - postgres-payments-data:/var/lib/postgresql
      # the application role's login, on an empty volume only
      - ./devtools/postgres-payments/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payments -d payments']
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction-mode pooler in front of postgres, for the application role only (ADR 0008).
  # api and worker go through it, in the `app` profile and under `pnpm dev` on the host alike;
  # the owner (migrations, seed, datagen) connects to postgres directly.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    volumes:
      - ./devtools/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./devtools/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # The broker between the services: commands and events (@oms/contracts, docs/adr/0011).
  # Management UI: http://localhost:15672 (guest / guest).
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  fake-psp:
    build:
      context: .
      dockerfile: devtools/fake-psp/Dockerfile
    environment:
      PORT: 4010
      FAKE_PSP_LATENCY_MS: 200
      FAKE_PSP_FAILURE_RATE: 0
      FAKE_PSP_DECLINE_RATE: 0
    ports:
      - '4010:4010'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4010/charges').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── profile: app ─────────────────────────────────────────────────────────────
  # One-shot migration step, never part of the api/worker CMD (data/migrations.md §2).
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: build
    image: oms-api-build:local
    working_dir: /repo/services/api
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_ADMIN_URL: postgresql://oms:oms@postgres:5432/oms?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: oms-api:local
    command: ['node', 'dist/entrypoints/main.api.js']
    env_file: services/api/.env.example
    environment:
      &app-env # through the pooler; the migrate step above goes to postgres directly, as the owner
      DATABASE_URL: postgresql://oms_app:oms_app@pgbouncer:6432/oms?schema=public
      DATABASE_REPLICA_URL: postgresql://oms_app:oms_app@pgbouncer:6432/oms_replica?schema=public
      # env_file is the dev environment; the processes themselves get no owner URL
      DATABASE_ADMIN_URL: ''
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PSP_BASE_URL: http://fake-psp:4010
    ports:
      - '3000:3000'
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fake-psp:
        condition: service_healthy

  worker:
    profiles: [app]
    image: oms-api:local
    command: ['node', 'dist/entrypoints/main.worker.js']
    env_file: services/api/.env.example
    environment: *app-env
    depends_on:
      <<: *app-deps
      api:
        condition: service_started

  # ── payments-service: its own image, database and migration step ───────────────
  migrate-payments:
    profiles: [app]
    build:
      context: .
      dockerfile: services/payments/Dockerfile
      target: build
    image: oms-payments-build:local
    working_dir: /repo/services/payments
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_ADMIN_URL: postgresql://payments:payments@postgres-payments:5432/payments?schema=public
    depends_on:
      postgres-payments:
        condition: service_healthy

  payments:
    profiles: [app]
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    image: oms-payments:local
    env_file: services/payments/.env.example
    environment:
      DATABASE_URL: postgresql://payments_app:payments_app@postgres-payments:5432/payments?schema=public
      # env_file is the dev environment; the process itself gets no owner URL
      DATABASE_ADMIN_URL: ''
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PSP_BASE_URL: http://fake-psp:4010
    depends_on:
      migrate-payments:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      fake-psp:
        condition: service_healthy

volumes:
  postgres-payments-data:
  postgres-data:
  postgres-replica-data:
  redis-data:
  rabbitmq-data:
