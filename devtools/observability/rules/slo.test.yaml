# What the SLIs say for six kinds of traffic (SLO-001…006, docs/adr/0028). A value that is
# the result of a division is compared within a millionth (`< bool 1e-6` → 1): floats.
# `pnpm test:rules` runs promtool on this file.
rule_files:
  - slo.yaml

evaluation_interval: 15s

tests:
  # SLO-001: every attempt is paid. One order a second, in the worker.
  - interval: 15s
    input_series:
      - series: 'orders_paid_total{process="worker", service="api"}'
        values: '0+15x40'
      # the api pays nothing: its counter is there and stays at 0
      - series: 'orders_paid_total{process="api", service="api"}'
        values: '0x40'
    promql_expr_test:
      - expr: sli:place_success:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'sli:place_success:ratio_rate5m'
            value: 1
      - expr: slo:place_success:error_budget_remaining
        eval_time: 10m
        exp_samples:
          - labels: 'slo:place_success:error_budget_remaining'
            value: 1

  # SLO-002: the provider is away. Nothing is paid, every attempt ends `provider_unavailable`.
  - interval: 15s
    input_series:
      - series: 'orders_paid_total{process="worker"}'
        values: '0x40'
      - series: 'orders_payment_failed_total{process="worker", cause="provider_unavailable"}'
        values: '0+15x40'
    promql_expr_test:
      - expr: sli:place_success:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'sli:place_success:ratio_rate5m'
            value: 0
      # the budget of the window is spent a hundred times over
      - expr: abs(slo:place_success:error_budget_remaining + 99) < bool 1e-6
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1

  # SLO-003: cards are declined, and that is all that fails. The system did its work.
  - interval: 15s
    input_series:
      - series: 'orders_paid_total{process="worker"}'
        values: '0+15x40'
      - series: 'orders_payment_failed_total{process="worker", cause="declined"}'
        values: '0+15x40'
    promql_expr_test:
      - expr: sli:place_success:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'sli:place_success:ratio_rate5m'
            value: 1

  # SLO-004: no attempt ended in the window. No value: nothing was promised and broken.
  - interval: 15s
    input_series:
      - series: 'orders_paid_total{process="worker"}'
        values: '7x40'
    promql_expr_test:
      - expr: sli:place_success:ratio_rate5m
        eval_time: 10m
        exp_samples: []

  # SLO-005: one attempt in a hundred fails on a timeout: exactly the objective, the budget
  # of the window is spent to the end and not beyond.
  - interval: 15s
    input_series:
      - series: 'orders_paid_total{process="worker"}'
        values: '0+99x40'
      - series: 'orders_payment_failed_total{process="worker", cause="timeout"}'
        values: '0+1x40'
    promql_expr_test:
      - expr: sli:place_success:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'sli:place_success:ratio_rate5m'
            value: 0.99
      - expr: abs(slo:place_success:error_budget_remaining) < bool 1e-6
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1

  # SLO-006: the latency of `place`, from the histogram of the api alone: other routes and
  # other methods are not in it.
  - interval: 15s
    input_series:
      - series: 'http_request_duration_seconds_bucket{method="POST", route="/v1/workspaces/:workspaceId/orders/:orderId/place", status="202", le="0.1"}'
        values: '0+90x40'
      - series: 'http_request_duration_seconds_bucket{method="POST", route="/v1/workspaces/:workspaceId/orders/:orderId/place", status="202", le="0.25"}'
        values: '0+100x40'
      - series: 'http_request_duration_seconds_bucket{method="POST", route="/v1/workspaces/:workspaceId/orders/:orderId/place", status="202", le="+Inf"}'
        values: '0+100x40'
      # a slow list request: not `place`
      - series: 'http_request_duration_seconds_bucket{method="GET", route="/v1/workspaces/:workspaceId/orders", status="200", le="+Inf"}'
        values: '0+100x40'
    promql_expr_test:
      # 90 % within 0.1 s, the rest within 0.25 s: the 95th percentile is halfway between
      - expr: abs(sli:place_latency:p95_5m - 0.175) < bool 1e-6
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
