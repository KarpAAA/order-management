;; PgBouncer of the local stack (docs/adr/0008-pgbouncer-transaction-mode.md).
;; Many client connections from api + worker replicas, few server connections to Postgres.

[databases]
oms = host=postgres port=5432 dbname=oms
;; the read replica, a pool of its own (docs/adr/0009-read-replica-routing.md)
oms_replica = host=postgres-replica port=5432 dbname=oms

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

;; A server connection belongs to a client from BEGIN to COMMIT, then goes back to the pool.
;; Nothing may outlive a transaction on it: no session-level SET, no pg_advisory_lock, no
;; LISTEN. The tenant setting is transaction-local for this reason (ADR 0006).
pool_mode = transaction

;; userlist.txt holds the application role only: the owner (migrations, seed, datagen) is not
;; in it and connects to Postgres directly. `stats` exists in PgBouncer alone, for
;; `SHOW POOLS` on the admin console (database `pgbouncer`).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
stats_users = stats

;; Client connections accepted; one more is refused at once.
max_client_conn = 500
;; Server connections per (database, user). A client that finds them all busy waits in line.
default_pool_size = 20
