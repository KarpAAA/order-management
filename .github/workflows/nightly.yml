# Slow suites that measure the tests and the contract, not a feature: on main, nightly and by
# hand (quality/testing.md §4–§6). Report only: they do not gate a merge yet.
name: Nightly

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # --incremental: only mutants in changed code or covered by changed tests run again.
      # A new key per run saves the result; restore takes the latest one of this branch.
      - uses: actions/cache@v6
        with:
          path: services/api/reports/stryker-incremental.json
          key: stryker-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.ref_name }}-
            stryker-main-
      - run: pnpm test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: services/api/reports/mutation
          if-no-files-found: ignore

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # everything runs in docker compose; pnpm only runs the root scripts
      - uses: pnpm/action-setup@v6
      - run: pnpm test:contract
      - if: always()
        run: pnpm contract:down
