packages:
  - services/*
  - devtools/*
ignoredBuiltDependencies:
  - '@scarf/scarf'
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - unrs-resolver
patchedDependencies:
  # Vitest 5 matches testNamePattern against names joined with " > "; the runner joined them
  # with " ", so the perTest filter selected no test and every mutant "survived". Drop the
  # patch once the runner supports Vitest 5.
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
# prisma 7.10 pins mysql2 3.15.3 (GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3). Same major, only the
# MySQL driver of the Prisma CLI uses it and this project is Postgres-only. Drop once prisma ships
# mysql2 >= 3.23.1.
overrides:
  mysql2: ^3.23.1
# Audit exceptions live in package.json → pnpm.auditConfig (pnpm 10.10 reads them only there):
#   GHSA-ggr8-5vv4-36mx  deepmerge-ts < 8 via @prisma/config: stack exhaustion on recursive object
#   graphs. It only merges our own prisma.config.ts, never request data; the fix is a major prisma
#   does not support yet. Re-check when prisma is upgraded.
