packages:
  - services/*
  - devtools/*
ignoredBuiltDependencies:
  - '@scarf/scarf'
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@swc/core'
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - unrs-resolver
patchedDependencies:
  # Vitest 5 matches testNamePattern against names joined with " > "; the runner joined them
  # with " ", so the perTest filter selected no test and every mutant "survived". Drop the
  # patch once the runner supports Vitest 5.
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
